name: virtualinvestor

services:
  db:
    image: postgres:16
    container_name: vi-db
    environment:
      POSTGRES_DB: virtualinvestor
      POSTGRES_USER: vi
      POSTGRES_PASSWORD: vi
    ports:
      # Localhost only: only this host's game server talks to the database.
      # LAN players reach the game through the web terminal (:5173), never
      # the database directly — and the trivial dev password stays home.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vi -d virtualinvestor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
