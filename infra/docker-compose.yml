name: virtualinvestor

services:
  db:
    image: postgres:16
    container_name: vi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtualinvestor
      POSTGRES_USER: vi
      POSTGRES_PASSWORD: vi
    ports:
      # Localhost only: only this host's game server talks to the database.
      # LAN players reach the game through the web terminal (:5173), never
      # the database directly — and the trivial dev password stays home.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vi -d virtualinvestor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Newsroom sidecar (newsroom-narrator): dockerized llama.cpp serving the
  # preconfigured instruct model (Qwen2.5-3B Q4_K_M). Opt-in via profile so a stock checkout behaves
  # exactly as before: `docker compose --profile narrator up -d`. The edge
  # reaches it at VI_NARRATOR_URL (default http://127.0.0.1:18080) with
  # VI_NARRATOR=llama; anything else keeps templates or bare headlines.
  narrator:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: vi-narrator
    restart: unless-stopped
    profiles:
      - narrator
    ports:
      # Localhost only, like the db: only this host's game server calls it.
      # Container port 8081 (see entrypoint.sh): host-filtered 8080 stays clear.
      - "127.0.0.1:18080:8081"
    volumes:
      - ./narrator-models:/models
      - ./narrator/fetch-model.sh:/fetch-model.sh:ro
      - ./narrator/entrypoint.sh:/entrypoint.sh:ro
    environment:
      MODEL_FILE: qwen2.5-3b-instruct-q4_k_m.gguf
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
